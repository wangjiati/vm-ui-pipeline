name: 功能请求
description: 为 VM 流水线提出新能力
title: "[功能] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 当前在哪个 VM 流程里做不到什么？
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 范围
      options:
        - label: 该能力仍把 UI 执行限制在虚拟机内（不在宿主机做 UI 自动化）。
          required: true
