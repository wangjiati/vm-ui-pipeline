name: Bug report
description: Report a defect in the host orchestrator, runner, or harness
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not run UI tests on the host to reproduce. Use a VM. This project
        intentionally rejects host-side UI testing.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command and the observed output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host environment
      description: Windows version, PowerShell version, .NET SDK, VMware version.
    validations:
      required: true
  - type: input
    id: guest
    attributes:
      label: Guest environment
      description: Windows version, session state (logged in / locked), display and DPI.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and results
      description: |
        Paste `pipeline-summary.json`, `junit.xml`, and the relevant `run.log` /
        `console.log` excerpts. Remove passwords and sensitive paths.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: confirms
    attributes:
      label: Confirmations
      options:
        - label: I did not run the UI test on the host.
          required: true
        - label: I removed passwords and secrets from the logs.
          required: true
